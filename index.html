<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <title>Md Shirajul Islam | Full Stack Engineer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              mono: ['"Fira Code"', 'monospace'],
            },
            colors: {
              'term-bg': '#050508',
              'term-main': 'var(--term-color)',
              'term-dim': 'var(--term-color-dim)',
              'term-error': '#ef4444',
            },
            animation: {
              'blink': 'blink 1s step-end infinite',
              'fade-in': 'fadeIn 0.3s ease-in-out forwards',
              'scanline': 'scanline 8s linear infinite',
              'glitch': 'glitch 0.2s linear infinite',
              'turn-on': 'turnOn 0.4s linear forwards',
            },
            keyframes: {
              blink: {
                '0%, 100%': { opacity: '1' },
                '50%': { opacity: '0' },
              },
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              scanline: {
                '0%': { transform: 'translateY(-100%)' },
                '100%': { transform: 'translateY(100%)' },
              },
              glitch: {
                '0%': { transform: 'translate(0)' },
                '20%': { transform: 'translate(-2px, 2px)' },
                '40%': { transform: 'translate(-2px, -2px)' },
                '60%': { transform: 'translate(2px, 2px)' },
                '80%': { transform: 'translate(2px, -2px)' },
                '100%': { transform: 'translate(0)' },
              },
              turnOn: {
                '0%': { transform: 'scale(1, 0.002)', opacity: 0, filter: 'brightness(30)' },
                '30%': { transform: 'scale(1, 0.002)', opacity: 1, filter: 'brightness(30)' },
                '50%': { transform: 'scale(1, 0.002)', opacity: 1, filter: 'brightness(30)' },
                '60%': { transform: 'scale(1, 1)', opacity: 1, filter: 'brightness(1)' },
                '100%': { transform: 'scale(1, 1)', opacity: 1, filter: 'brightness(1)' }
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --term-color: #10b981; /* Default Green */
        --term-color-dim: rgba(16, 185, 129, 0.1);
      }
      
      body {
        background-color: #050508;
        color: var(--term-color);
        overflow: hidden;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #050508; 
      }
      ::-webkit-scrollbar-thumb {
        background: #1f2937; 
        border-radius: 2px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #374151; 
      }

      .crt::before {
        content: " ";
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
        z-index: 50;
        background-size: 100% 2px, 3px 100%;
        pointer-events: none;
      }

      .crt-flicker {
        animation: textShadow 1.6s infinite;
      }

      @keyframes textShadow {
        0% { text-shadow: 0.4389924193300864px 0 1px rgba(0,30,255,0.5), -0.4389924193300864px 0 1px rgba(255,0,80,0.3), 0 0 3px; }
        5% { text-shadow: 2.7928974010788217px 0 1px rgba(0,30,255,0.5), -2.7928974010788217px 0 1px rgba(255,0,80,0.3), 0 0 3px; }
        /* ... simplified for performance ... */
        100% { text-shadow: 0.4389924193300864px 0 1px rgba(0,30,255,0.5), -0.4389924193300864px 0 1px rgba(255,0,80,0.3), 0 0 3px; }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.574.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>

    <div id="root" class="w-full h-full"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
